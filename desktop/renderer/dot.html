<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
#d{position:absolute;inset:5px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#a28aff,#6241e8 72%,#4225b8);border:1px solid rgba(255,255,255,.55);box-shadow:0 5px 18px #4e32c866,0 0 0 1px #ffffff20;animation:dot-arrive 260ms cubic-bezier(.22,1,.36,1) both;transition:transform 160ms ease,box-shadow 160ms ease;color:#fff;font:800 17px 'Segoe UI',sans-serif}
#d:after{content:'S';text-shadow:0 1px 3px #39218d}
#hit:active+#d{transform:scale(.9);box-shadow:0 0 0 3px #a995ff66,0 5px 18px #4e32c866}
@keyframes dot-arrive{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#d{animation:none;transition:none}}
#hit{position:absolute;inset:0;cursor:grab}
</style></head>
<body><div id="hit"></div><div id="d"></div>
<script>
const hit = document.getElementById('hit');
const displayMode = new URLSearchParams(window.location.search).get('display') || 'bubble';
let down=false,moved=false,swiped=false,sx=0,sy=0,wx=0,wy=0,long=null,fired=false;
hit.addEventListener('mousedown',(e)=>{
 down=true;moved=false;swiped=false;fired=false;sx=e.screenX;sy=e.screenY;wx=window.screenX;wy=window.screenY;
 long=setTimeout(()=>{if(!moved){fired=true;api.dotPanel()}},550);
});
window.addEventListener('mousemove',(e)=>{
 if(!down||swiped)return;
 const dx=e.screenX-sx,dy=e.screenY-sy;
 if(displayMode==='swipe'&&Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.35){
  swiped=true;moved=true;clearTimeout(long);api.dotSwipe(dx<0?'left':'right');return;
 }
 if(Math.abs(dx)>6||Math.abs(dy)>6){moved=true;clearTimeout(long)}
 if(moved)api.dotMove(wx+dx,wy+dy);
});
window.addEventListener('mouseup',()=>{
 if(!down)return;down=false;clearTimeout(long);
 if(swiped)return;
 if(moved)api.dotSave();else if(!fired)api.dotClick();
});
</script></body></html>
