<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
#d{position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:50%;background:#000}
#hit{position:absolute;inset:0;cursor:default}
</style></head>
<body><div id="hit"></div><div id="d"></div>
<script>
const hit = document.getElementById('hit');
let down = false, moved = false, sx = 0, sy = 0, wx = 0, wy = 0, long = null, fired = false;
hit.addEventListener('mousedown', (e) => {
  down = true; moved = false; fired = false; sx = e.screenX; sy = e.screenY; wx = window.screenX; wy = window.screenY;
  long = setTimeout(() => { if (!moved) { fired = true; api.dotPanel(); } }, 650);
});
window.addEventListener('mousemove', (e) => {
  if (!down) return;
  const dx = e.screenX - sx, dy = e.screenY - sy;
  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) { moved = true; clearTimeout(long); }
  if (moved) api.dotMove(wx + dx, wy + dy);
});
window.addEventListener('mouseup', () => {
  if (!down) return;
  down = false; clearTimeout(long);
  if (moved) api.dotSave(); else if (!fired) api.dotClick();
});
</script></body></html>
