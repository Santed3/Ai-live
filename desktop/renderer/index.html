<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; media-src 'self' blob:">
<title>ScreenBubble</title>
<style>
:root{--bg:rgba(15,16,20,.96);--card:#1d1f27;--text:#eef0f6;--muted:#8d95ad;--accent:#7cf5c8;--primary:#6c47ff;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--text);font:14px/1.5 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.view{display:none;height:100%}
#app{flex-direction:column;background:var(--bg);border-radius:20px;border:1px solid var(--line);overflow:hidden}
body[data-v=chat] #app{display:flex;animation:pop .22s ease-out}
body[data-v=menu] #menu{display:block;animation:pop .2s ease-out}
body[data-v=bar] #bar{display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
#bar{cursor:pointer}
#pill{position:absolute;right:1px;top:20px;width:6px;height:56px;border-radius:4px;background:linear-gradient(#8b6bff,#6c47ff);box-shadow:0 0 0 1px rgba(255,255,255,.3)}
#menu{background:var(--bg);border-radius:20px;padding:14px;border:1px solid var(--line)}
#menu h2{margin:0 0 10px 4px;font-size:15px;font-weight:600;letter-spacing:.01em}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:76px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid transparent;cursor:pointer;text-align:center;font-size:11.5px;color:#c9cedf;padding:4px;transition:background .15s,transform .15s,border-color .15s}
.tile:hover{background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.5);transform:translateY(-1px)}
.tile i{font-style:normal;font-size:22px}
header{display:flex;align-items:center;gap:4px;padding:10px 10px 6px 12px;-webkit-app-region:drag}
header h1{flex:1;margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
header h1::before{content:"";width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#b9a8ff,#6c47ff);box-shadow:0 0 10px rgba(124,92,255,.8)}
button{-webkit-app-region:no-drag;font:inherit;color:var(--text);background:rgba(255,255,255,.08);border:0;border-radius:12px;padding:5px 10px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:rgba(255,255,255,.16)}
button:active{transform:scale(.96)}
button.p{background:linear-gradient(135deg,#7a58ff,#5b3be0)} button.on{background:var(--primary)} button.x{background:transparent}
header button{background:transparent;color:var(--muted);padding:4px 8px;font-size:13px}
header button:hover{background:rgba(255,255,255,.1);color:var(--text)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{white-space:nowrap;background:transparent;border:1px solid var(--line);color:#c4c9dc;font-size:12px;padding:4px 11px;border-radius:999px}
#chips button:hover{border-color:rgba(124,92,255,.7);background:rgba(124,92,255,.15)}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 14px 10px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:6px}#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.m{max-width:92%;word-break:break-word;user-select:text;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.u{align-self:flex-end;background:linear-gradient(135deg,#7a58ff,#5a3bdc);padding:8px 13px;border-radius:18px 18px 4px 18px;white-space:pre-wrap}
.m.a{align-self:flex-start;padding:2px 2px 2px 0}
.m.a p{margin:0 0 6px}.m.a p:last-child{margin:0}
.m.a ul,.m.a ol{margin:2px 0 6px;padding-left:20px}
.m.a code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font:12.5px Consolas,monospace}
.m.a pre{background:#12131a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-x:auto;margin:4px 0}
.m.a pre code{background:none;padding:0}
.m.a a{color:#a995ff;text-decoration:none;border-bottom:1px solid rgba(169,149,255,.4);cursor:pointer}
.s{align-self:flex-start;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;padding:3px 10px 3px 8px;border-radius:999px;background:rgba(255,255,255,.05);animation:in .2s ease-out}
.s::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid rgba(124,245,200,.25);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{align-self:flex-start;display:flex;gap:4px;padding:8px 4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:none;margin:0 12px 8px}
.card.show{display:block;animation:in .2s ease-out}
#confirm{background:#33270f;border-color:rgba(255,190,80,.35)}
.card label{color:var(--accent);font-size:12px}
#draft{width:100%;min-height:70px;max-height:160px;margin-top:4px;background:transparent;border:0;color:var(--text);font:inherit;resize:vertical;outline:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#inrow{display:flex;gap:6px;align-items:flex-end;margin:0 10px 10px;padding:5px 5px 5px 14px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:22px;transition:border-color .15s}
#inrow:focus-within{border-color:rgba(124,92,255,.7)}
#inp{flex:1;resize:none;max-height:90px;background:transparent;border:0;color:var(--text);font:inherit;padding:6px 0;outline:0}
#inrow button{border-radius:50%;width:34px;height:34px;padding:0;font-size:15px}
#setup{display:none}
#setup input{width:100%;padding:8px;border-radius:10px;border:0;margin:6px 0;background:rgba(255,255,255,.12);color:var(--text)}
</style></head>
<body data-v="bar"><div id="bar" class="view"><div id="pill"></div></div><div id="menu" class="view"><h2>ScreenBubble</h2><div id="grid"></div></div><div id="app" class="view">
  <header>
    <button id="hide" title="Meny">‹</button><h1>ScreenBubble</h1>
    <button id="speak" title="Läs upp svar">🔇</button>
    <button id="convo" title="Fritt samtal">🎙</button>
    <button id="new" title="Ny konversation">＋</button>
        <button id="quit" class="x" title="Minimera">✕</button>
  </header>
  <div id="setup" class="card show"><label>OpenAI API-nyckel krävs</label><input id="key" type="password" placeholder="sk-..."><button id="savekey" class="p">Spara</button></div>
  <div id="chips"></div>
  <div id="chat"></div>
  <div id="draftcard" class="card">
    <label>Förslag (redigera fritt)</label>
    <textarea id="draft"></textarea>
    <div class="row" id="tools"></div>
    <div class="row">
      <button id="copy">Kopiera</button><button id="insert">Skriv in</button><button id="sendd" class="p">Skicka</button><button id="closed">Stäng</button>
    </div>
  </div>
  <div id="confirm" class="card"><div id="ctext" style="white-space:pre-wrap"></div><div class="row"><button id="yes" class="p">Ja, gör det</button><button id="no">Nej</button></div></div>
  <div id="inrow"><textarea id="inp" rows="1" placeholder="Fråga eller säg vad jag ska göra…"></textarea><button id="mic">🎤</button><button id="go" class="p">➤</button></div>
</div>
<script src="app.js"></script>
</body></html>
