<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
#t{box-sizing:border-box;width:100%;height:100%;background:rgba(12,13,17,.94);color:#eef0f6;font:13px/19px 'Segoe UI',sans-serif;padding:8px 11px;border:1px solid rgba(255,255,255,.1);border-radius:10px;white-space:pre-wrap;word-break:break-word;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.24);animation:answer-in 190ms cubic-bezier(.22,1,.36,1) both}@keyframes answer-in{from{opacity:0;transform:translateY(5px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){#t{animation:none}}
</style></head>
<body><div id="t"></div>
<script>
const t = document.getElementById('t');
api.onAnswer((s) => { t.textContent = s; });
t.addEventListener('click', () => api.answerClick());
</script></body></html>
