name: Bygg APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Lägg in API-nyckeln (valfritt)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            sed -i "s|__OPENAI_KEY__|$OPENAI_API_KEY|" app/src/main/java/com/example/screenbubble/Config.kt
            echo "::notice title=Nyckel::Nyckel inbyggd i APK"
          else
            echo "::warning title=Nyckel::Ingen secret satt, appen frågar efter nyckeln"
          fi

      - name: Bygg APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain -Pkotlin.compiler.execution.strategy=in-process > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "\.kt|^e: |Unresolved|error:" build.log | grep -v "^w: " | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle-fel::${msg}"
            tail -15 build.log | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=Slutet av loggen::/'
          fi
          exit $code

      - name: Döp om filen
        run: cp app/build/outputs/apk/release/app-release.apk ScreenBubble.apk

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: ScreenBubble (senaste version)
          make_latest: true
          files: ScreenBubble.apk
