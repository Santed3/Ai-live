name: Bygg Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lägg in API-nyckeln (valfritt)
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            sed -i "s|__OPENAI_KEY__|$OPENAI_API_KEY|" desktop/config.json
            echo "::notice title=Nyckel::Nyckel inbyggd i Windows-appen"
          else
            echo "::warning title=Nyckel::Ingen secret satt, appen frågar efter nyckeln"
          fi

      - name: Installera
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Bygg installationsfil
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      - name: Lista resultat
        shell: bash
        run: ls -la desktop/dist

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: ScreenBubble (senaste version)
          make_latest: true
          files: desktop/dist/ScreenBubble-Setup.exe
